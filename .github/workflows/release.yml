name: Publish macOS release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-14
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Check release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)
          if [[ "$RELEASE_TAG" != "v$version" ]]; then
            echo "Tag $RELEASE_TAG must match Info.plist version v$version" >&2
            exit 1
          fi
      - name: Test
        run: swift test
      - name: Build universal app, DMG, ZIP, and checksums
        run: ./scripts/build-universal.sh
      - uses: actions/upload-artifact@v4
        with:
          name: CatchMouse-${{ github.ref_name }}-universal
          path: |
            dist/CatchMouse-universal.dmg
            dist/CatchMouse-universal.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" \
            dist/CatchMouse-universal.dmg \
            dist/CatchMouse-universal.zip \
            dist/SHA256SUMS.txt \
            --verify-tag \
            --title "CatchMouse $RELEASE_TAG" \
            --notes-file .github/RELEASE_NOTES.md \
            --generate-notes
          gh release view "$RELEASE_TAG" --json url --jq .url >> "$GITHUB_STEP_SUMMARY"
