name: Build and test
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  universal:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Test navigation and shortcut persistence
        run: swift test
      - name: Build and verify Intel + Apple Silicon
        run: ./scripts/build-universal.sh
      - uses: actions/upload-artifact@v4
        with:
          name: CatchMouse-universal
          path: |
            dist/CatchMouse-universal.dmg
            dist/CatchMouse-universal.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
